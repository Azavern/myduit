# Konfigurasi Supabase CLI untuk pengembangan lokal (Docker).
# PENTING: aplikasi ini TIDAK memakai Supabase Auth, Data API, maupun Storage.
# Supabase hanya dipakai sebagai PostgreSQL terkelola + runner migration.
#
# Karena itu `[auth]`, `[storage]`, dan fitur bawaan lain sengaja tidak
# diaktifkan. Schema `app_private` tidak boleh masuk daftar schema yang
# diekspos Data API.

project_id = "myduit"

[api]
enabled = false
schemas = []
extra_search_path = []
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[auth]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false
